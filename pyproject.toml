[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xregrid"
version = "0.1.0"
description = "An optimized ESMF-based regridder for xarray"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.xregrid]
dependencies = [
    "xarray",
    "numpy",
    "scipy",
    "dask",
    "cubed",
    "cubed-xarray",
    "zarr>=3.1.2",
    "netCDF4",
    "esmpy",
    "cf-xarray",
    "pyproj",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-benchmark",
    "pytest-mock",
    "pooch",
    "pre-commit",
    "hypothesis",
]
docs = [
    "zensical",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-gallery",
    "matplotlib",
    "cartopy",
    "pooch",
]
viz = [
    "matplotlib",
    "cartopy",
    "hvplot",
    "geoviews",
]
full = [
    "xregrid[test,viz]",
    "xesmf",
    "uxarray",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
xregrid = "xregrid.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 132

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B028",  # explicit `stacklevel` in `warnings.warn`
]
